name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck, unit tests, production build, static-mode e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Production build (full stack profile)
        run: npm run build
      - name: Production build (static browser profile, GitHub Pages base path)
        run: npm run build:static
        env:
          GF_BASE: /geofabric/
      - name: Static-mode browser tests (no Gateway, no PostGIS)
        # the GitHub-hosted runner ships Google Chrome: no browser download
        run: GF_OUT=dist PW_CHANNEL=chrome npx playwright test -c playwright.static.config.ts

  architecture:
    name: Architecture rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/arch_check.py

  rust:
    name: Rust workspace tests (DuckDB server engine, offline PostGIS tests)
    # Windows: the verified prebuilt libduckdb used for development (ADR-006) is the Windows archive.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate the small synthetic GeoParquet files the gateway tests read (benchmarks/data is not committed)
        run: |
          python -m pip install pyarrow "duckdb==1.5.6" numpy
          python benchmarks/gen_synthetic.py --size 10mb --out benchmarks/data
      - name: Pre-install the DuckDB spatial extension (same DuckDB version as the library)
        run: python -c "import duckdb; duckdb.connect().execute('INSTALL spatial')"
      - name: Fetch and verify the prebuilt libduckdb (sha256-pinned)
        shell: bash
        run: |
          python tools/duckdb_prebuilt.py
          lib="$(python tools/duckdb_prebuilt.py --env | sed -E 's/^export DUCKDB_LIB_DIR="([^"]+)".*/\1/')"
          echo "DUCKDB_LIB_DIR=$lib" >> "$GITHUB_ENV"
          echo "$lib" >> "$GITHUB_PATH"
      - name: "Tests (no database server is started; live PostgreSQL tests skip and are not counted as evidence)"
        # serial: with 2+ test threads the first DuckDB query of a test process failed sporadically on the hosted runner ("Error code 1", not
        # reproduced locally, not root-caused); serial runs are the mitigation, not an explanation
        run: cargo test --workspace --no-default-features -- --test-threads=1
      - name: Diagnostics when the tests failed (DuckDB probe, then the semi-join tests alone, three times)
        if: failure()
        shell: bash
        run: |
          cargo run -q -p geo-engine-duckdb --example probe --no-default-features || true
          for i in 1 2 3; do cargo test -q -p geo-runtime --test semi_join --no-default-features -- --nocapture --test-threads=1 2>&1 | tail -25 || true; done

  duckdb-repro:
    # CI flake investigation: DuckDB start-up alone (no GeoFabric code beyond the crate build), many connections, with and without threads and a
    # pre-installed extension. If this never fails while the test suite does, the problem is not DuckDB start-up.
    name: "DuckDB start-up repro (threads=${{ matrix.threads }}, extension=${{ matrix.ext }})"
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { threads: 1, ext: fresh, flags: "" }
          - { threads: 4, ext: fresh, flags: "--arrow-first" }
          - { threads: 4, ext: pre, flags: "--arrow-first" }
          - { threads: 4, ext: pre, flags: "--arrow-first --lock" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch and verify the prebuilt libduckdb (sha256-pinned)
        shell: bash
        run: |
          python tools/duckdb_prebuilt.py
          lib="$(python tools/duckdb_prebuilt.py --env | sed -E 's/^export DUCKDB_LIB_DIR="([^"]+)".*/\1/')"
          echo "DUCKDB_LIB_DIR=$lib" >> "$GITHUB_ENV"
          echo "$lib" >> "$GITHUB_PATH"
      - name: Pre-install the spatial extension
        if: matrix.ext == 'pre'
        run: |
          python -m pip install "duckdb==1.5.6"
          python -c "import duckdb; duckdb.connect().execute('INSTALL spatial')"
      - name: Repro (200 iterations per thread)
        run: cargo run -q -p geo-engine-duckdb --example duckdb_repro --no-default-features -- --iters 200 --threads ${{ matrix.threads }} ${{ matrix.flags }}

  rust-parallel-experiment:
    # NOT a gate (continue-on-error): the Rust suite with parallel test threads, to collect the engine's failure diagnostics from the hosted runner.
    name: "Rust tests, parallel (experiment: failures here print diagnostics, they do not fail CI)"
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Synthetic test data
        run: |
          python -m pip install pyarrow "duckdb==1.5.6" numpy
          python benchmarks/gen_synthetic.py --size 10mb --out benchmarks/data
      - name: Fetch and verify the prebuilt libduckdb (sha256-pinned)
        shell: bash
        run: |
          python tools/duckdb_prebuilt.py
          lib="$(python tools/duckdb_prebuilt.py --env | sed -E 's/^export DUCKDB_LIB_DIR="([^"]+)".*/\1/')"
          echo "DUCKDB_LIB_DIR=$lib" >> "$GITHUB_ENV"
          echo "$lib" >> "$GITHUB_PATH"
      - name: Tests with 4 threads, three attempts
        shell: bash
        run: |
          for i in 1 2 3; do
            echo "=== attempt $i"
            cargo test --workspace --no-default-features -- --test-threads=4 2>&1 | grep -E "^test result: FAILED|FAILED|panicked|\[diag " | cut -c1-900 || true
          done

