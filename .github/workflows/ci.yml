name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck, unit tests, production build, static-mode e2e)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # the browser lowering is the Rust crate geo-lowering compiled to WebAssembly (RFC-004); every web step below needs it
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: npm run typecheck
      - run: npm test
      - name: Production build (full stack profile)
        run: npm run build
      # The static tests are self-contained: the data is BUNDLED into the test site (GF_DEMO), never read from the CDN, so CI does not depend on
      # a third-party host. The deployed site is checked against the real host by the Pages workflow and by the live-URL run.
      - name: "Production build (static profile, Pages base path), data bundled, range-capable test host"
        run: |
          npm run build:static
          GF_OUT=dist GF_DEMO=bundle-range node scripts/copy-demo.mjs
        env:
          GF_BASE: /geofabric/
      - name: Static-mode browser tests, range-capable host (partial reads are asserted)
        # the GitHub-hosted runner ships Google Chrome: no browser download
        run: GF_OUT=dist GF_SERVER_ARGS="--range-head" PW_CHANNEL=chrome npx playwright test -c playwright.static.config.ts
      - name: "Static-mode browser tests, whole-file host (GitHub Pages behaviour, ranged HEAD answered 200)"
        run: |
          GF_OUT=dist GF_DEMO=bundle node scripts/copy-demo.mjs
          GF_OUT=dist PW_CHANNEL=chrome npx playwright test -c playwright.static.config.ts

  architecture:
    name: Architecture rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/arch_check.py

  rust:
    name: Rust workspace tests (DuckDB server engine, offline PostGIS tests)
    # Windows: the verified prebuilt libduckdb used for development (ADR-006) is the Windows archive.
    runs-on: windows-latest
    env:
      # authenticated GitHub API reads in tools/duckdb_prebuilt.py (anonymous reads of a shared runner IP were rate-limited and failed a whole run)
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Generate the small synthetic GeoParquet files the gateway tests read (benchmarks/data is not committed)
        run: |
          python -m pip install pyarrow "duckdb==1.5.6" numpy
          python benchmarks/gen_synthetic.py --size 10mb --out benchmarks/data
      - name: Pre-install the DuckDB spatial extension (same DuckDB version as the library)
        run: python -c "import duckdb; duckdb.connect().execute('INSTALL spatial')"
      - name: Fetch and verify the prebuilt libduckdb (sha256-pinned)
        shell: bash
        run: |
          python tools/duckdb_prebuilt.py
          lib="$(python tools/duckdb_prebuilt.py --env | sed -E 's/^export DUCKDB_LIB_DIR="([^"]+)".*/\1/')"
          echo "DUCKDB_LIB_DIR=$lib" >> "$GITHUB_ENV"
          echo "$lib" >> "$GITHUB_PATH"
      - name: "Tests (no database server is started; live PostgreSQL tests skip and are not counted as evidence)"
        # Parallel again (default test threads). The earlier mitigation (--test-threads=1) hid a real defect: the DuckDB profiler's JSON output made
        # concurrent in-process engines fail sporadically; it is now opt-in (see the flake-experiment job: profiler on 8 of 40 runs failed, off 0 of 50).
        run: cargo test --workspace --no-default-features
      - name: Diagnostics when the tests failed (DuckDB probe, then the semi-join tests alone, three times)
        if: failure()
        shell: bash
        run: |
          cargo run -q -p geo-engine-duckdb --example probe --no-default-features || true
          for i in 1 2 3; do cargo test -q -p geo-runtime --test semi_join --no-default-features -- --nocapture --test-threads=1 2>&1 | tail -25 || true; done

  duckdb-repro:
    # CI flake investigation: DuckDB start-up alone (no GeoFabric code beyond the crate build), many connections, with and without threads and a
    # pre-installed extension. If this never fails while the test suite does, the problem is not DuckDB start-up.
    name: "DuckDB start-up repro (threads=${{ matrix.threads }}, extension=${{ matrix.ext }})"
    runs-on: windows-latest
    env:
      # authenticated GitHub API reads in tools/duckdb_prebuilt.py (anonymous reads of a shared runner IP were rate-limited and failed a whole run)
      GITHUB_TOKEN: ${{ github.token }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { threads: 1, ext: fresh, flags: "" }
          - { threads: 4, ext: fresh, flags: "--arrow-first" }
          - { threads: 4, ext: pre, flags: "--arrow-first" }
          - { threads: 4, ext: pre, flags: "--arrow-first --lock" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch and verify the prebuilt libduckdb (sha256-pinned)
        shell: bash
        run: |
          python tools/duckdb_prebuilt.py
          lib="$(python tools/duckdb_prebuilt.py --env | sed -E 's/^export DUCKDB_LIB_DIR="([^"]+)".*/\1/')"
          echo "DUCKDB_LIB_DIR=$lib" >> "$GITHUB_ENV"
          echo "$lib" >> "$GITHUB_PATH"
      - name: Pre-install the spatial extension
        if: matrix.ext == 'pre'
        run: |
          python -m pip install "duckdb==1.5.6"
          python -c "import duckdb; duckdb.connect().execute('INSTALL spatial')"
      - name: Repro (200 iterations per thread)
        run: cargo run -q -p geo-engine-duckdb --example duckdb_repro --no-default-features -- --iters 200 --threads ${{ matrix.threads }} ${{ matrix.flags }}

  rust-parallel-experiment:
    # NOT a gate (continue-on-error): the Rust suite with parallel test threads, to collect the engine's failure diagnostics from the hosted runner.
    name: "Rust tests, parallel (experiment: failures here print diagnostics, they do not fail CI)"
    runs-on: windows-latest
    env:
      # authenticated GitHub API reads in tools/duckdb_prebuilt.py (anonymous reads of a shared runner IP were rate-limited and failed a whole run)
      GITHUB_TOKEN: ${{ github.token }}
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Synthetic test data
        run: |
          python -m pip install pyarrow "duckdb==1.5.6" numpy
          python benchmarks/gen_synthetic.py --size 10mb --out benchmarks/data
      - name: Fetch and verify the prebuilt libduckdb (sha256-pinned)
        shell: bash
        run: |
          python tools/duckdb_prebuilt.py
          lib="$(python tools/duckdb_prebuilt.py --env | sed -E 's/^export DUCKDB_LIB_DIR="([^"]+)".*/\1/')"
          echo "DUCKDB_LIB_DIR=$lib" >> "$GITHUB_ENV"
          echo "$lib" >> "$GITHUB_PATH"
      - name: Tests with 4 threads, three attempts
        shell: bash
        run: |
          for i in 1 2 3; do
            echo "=== attempt $i"
            cargo test --workspace --no-default-features -- --test-threads=4 2>&1 | grep -E "^test result: FAILED|FAILED|panicked|\[diag " | cut -c1-900 || true
          done

  flake-experiment:
    # Controlled experiment on the one failure that remains unexplained (an opaque DuckDB "Error code 1" on the engine's query, only with parallel
    # test threads, never in the bare DuckDB repro above). Same tests, same runner, only the DuckDB profiler differs. NOT a gate.
    name: "Flake experiment (profiler=${{ matrix.profile }}, test threads=4; default = profiler off)"
    runs-on: windows-latest
    continue-on-error: true
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GF_PROFILE_MODE: ${{ matrix.profile }}
    strategy:
      fail-fast: false
      matrix:
        profile: ["default", "1"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Synthetic test data
        run: |
          python -m pip install pyarrow "duckdb==1.5.6" numpy
          python benchmarks/gen_synthetic.py --size 10mb --out benchmarks/data
      - name: Fetch and verify the prebuilt libduckdb (sha256-pinned)
        shell: bash
        run: |
          python tools/duckdb_prebuilt.py
          lib="$(python tools/duckdb_prebuilt.py --env | sed -E 's/^export DUCKDB_LIB_DIR="([^"]+)".*/\1/')"
          echo "DUCKDB_LIB_DIR=$lib" >> "$GITHUB_ENV"
          echo "$lib" >> "$GITHUB_PATH"
      - name: Build the test binaries once
        run: cargo test -p geo-runtime --no-default-features --test vertical --test semi_join --no-run
      - name: "Run the two DuckDB-heavy test files 25 times with 4 test threads and count failures"
        shell: bash
        run: |
          if [ "$GF_PROFILE_MODE" = "1" ]; then export GEOFABRIC_DUCKDB_PROFILE=1; fi
          fails=0
          for i in $(seq 1 25); do
            out=$(cargo test -p geo-runtime --no-default-features --test vertical --test semi_join -- --test-threads=4 2>&1) || { fails=$((fails+1)); echo "--- attempt $i FAILED"; echo "$out" | grep -E "FAILED|panicked|diag" | cut -c1-400 | head -4; }
          done
          echo "RESULT profiler=${GF_PROFILE_MODE}: $fails of 25 attempts failed"

