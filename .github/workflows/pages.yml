name: Deploy static demo

# Builds the browser-only (static) profile from source and publishes it to GitHub Pages.
# Nothing is uploaded from a developer machine: the site is exactly what this workflow builds from the commit.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/configure-pages@v5
      - name: Install
        working-directory: web
        run: npm ci
      - name: Build (static browser profile) and add the public demo pack
        working-directory: web
        run: npm run build:static
        env:
          GF_BASE: /${{ github.event.repository.name }}/
      - name: Verify the public data host (real HEAD/GET Range, Content-Range, CORS, SHA-256 of the served bytes)
        # the deployed demo reads its data from the host named by data/public-demo/pack.json; refuse to deploy a site whose data host is not
        # range-capable. (No manifest host = the data is bundled and nothing remote is checked.)
        run: |
          if python -c "import json,sys; sys.exit(0 if json.load(open('data/public-demo/pack.json')).get('host') else 1)"; then
            python data/scripts/verify_range_host.py --origin "https://${{ github.repository_owner }}.github.io"
          else
            echo "no remote data host in the manifest: data is bundled"
          fi
      - name: Verify the bundle needs nothing private
        run: |
          if grep -rEl "127\.0\.0\.1|localhost:|192\.168\.|:8787|:5433" web/dist --include=*.js --include=*.html --include=*.css | grep -v "node_modules" ; then
            echo "::error::the production bundle references a local/private endpoint"; exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
