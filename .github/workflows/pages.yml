name: Deploy static demo

# Builds the browser-only (static) profile from source and publishes it to GitHub Pages.
# Nothing is uploaded from a developer machine: the site is exactly what this workflow builds from the commit.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/configure-pages@v5
      - name: Install
        working-directory: web
        run: npm ci
      - name: Build (static browser profile) and add the public demo pack
        working-directory: web
        run: npm run build:static
        env:
          GF_BASE: /${{ github.event.repository.name }}/
      - name: Verify the bundle needs nothing private
        run: |
          if grep -rEl "127\.0\.0\.1|localhost:|192\.168\.|:8787|:5433" web/dist --include=*.js --include=*.html --include=*.css | grep -v "node_modules" ; then
            echo "::error::the production bundle references a local/private endpoint"; exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
