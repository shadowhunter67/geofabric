[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[profile.dev]
# DuckDB bundled made a 26 GB debug target/ (ADR-006) and, with debug info, the test
# binaries that link it exceed the MSVC PDB limit (LNK1140). No debug info in dev builds.
debug = 0

# the browser lowering shipped to the page as WebAssembly (web/scripts/build-lowering-wasm.mjs): smallest size, no unwinding
[profile.wasm]
inherits = "release"
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
